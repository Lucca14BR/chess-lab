<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chess Lab — plataforma pessoal de estudo, treino e análise de xadrez. A arte de evoluir." />
    <title>Chess Lab — A arte de evoluir</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura para evitar flash.
      try {
        var t = localStorage.getItem('chesslab-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
